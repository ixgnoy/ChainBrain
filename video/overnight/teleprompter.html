<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Teleprompter v4.1</title>
<style>
:root{--bg:#0b0c0e;--text:#f2f1ee;--muted:#7d7e86;--hi:#9dcaff;--warn:#f04e23}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;background:#0b0c0ef0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-bottom:1px solid #222}
header b{font-size:20px}button,select,input{font:inherit;background:#1b1c20;color:var(--text);border:1px solid #333;border-radius:8px;padding:6px 12px}
main{max-width:900px;margin:0 auto;padding:24px 16px 50vh}.line{font-size:clamp(26px,4vw,40px);line-height:1.35;margin:0 0 28px;color:var(--muted);transition:color .2s}
.line.on{color:var(--text)}.line.done{color:#4a4b52}.id{font:12px ui-monospace,monospace;color:#555;display:block}
#clock{font:600 22px ui-monospace,monospace}.over{color:var(--warn)}.tip{color:var(--muted);font-size:14px}
</style>
<header><b id=file></b><button id=prev>&larr;</button><button id=go>Start (space)</button><button id=next>&rarr;</button>
<label>pace <input id=wpm type=number min=120 max=170 value=145 style="width:4.5em"> wpm</label>
<span id=clock>0.0 s</span><span class=tip id=target></span></header>
<main id=m></main>
<script>
const D=[{"file": "01-hook.m4a", "lines": [{"id": "m1", "text": "Back in May, one post written in Morse code"}, {"id": "m2", "text": "tricked an AI agent into giving away over a hundred and fifty thousand US dollars."}, {"id": "m3", "text": "Most people would let an agent handle routine tasks. Only nine percent would let it buy on its own."}]}, {"file": "02-card.m4a", "lines": [{"id": "n1", "text": "We give your AI its own card."}, {"id": "n2", "text": "Every agent, Claude, ChatGPT, or ours, gets its own AI Card."}, {"id": "n3", "text": "Its limits live in the card's own smart contract, on FISCO BCOS."}, {"id": "n4", "text": "And a second AI watches every payment."}]}, {"file": "03-first-payment.m4a", "lines": [{"id": "g1", "text": "Tell it the job, like daily durian export news."}, {"id": "g2", "text": "It builds the card in front of you, and you approve every rule."}, {"id": "g3", "text": "Slide to approve, and the card's live."}, {"id": "u0", "text": "If the job is unclear, it can ask one question first."}, {"id": "u1", "text": "It pays small amounts on its own. Here the sellers are test versions of Exa and CoinGecko."}]}, {"file": "04-xray.m4a", "lines": [{"id": "x1", "text": "Let's X-ray that payment."}, {"id": "x2", "text": "The owner key stays on your phone. Our server makes one agent key per card, and the AI never holds one."}, {"id": "x3", "text": "The AI picks a seller, which names its price over x402."}, {"id": "x4", "text": "Our server checks the payment against your task, looks at where the seller's money goes, and tests it first."}, {"id": "x5", "text": "The agent key signs one exact payment, and a facilitator sends it to the chain."}, {"id": "x6a", "text": "Some agent wallets check limits on the company's server."}, {"id": "x6", "text": "Here the token asks the card, which runs its own eight checks first."}, {"id": "x7", "text": "All eight pass, so it goes through on FISCO BCOS, with a hash you can open in our explorer."}]}, {"file": "05-use-it.m4a", "lines": [{"id": "u2", "text": "Above the amount you chose, the card asks you to sign on your phone too."}, {"id": "u4", "text": "An unlisted seller gets refused, and the agent re-plans or asks you."}, {"id": "u3", "text": "The agent negotiates the price down, from twelve Hong Kong dollars to eight dollars eighty."}, {"id": "r1", "text": "It's your card, so you can cancel it mid-task and take back what's left."}]}, {"file": "06-break-it.m4a", "lines": [{"id": "k1", "text": "Now, let's break it."}, {"id": "k2", "text": "We try hidden orders, data requests, even a fake admin. Nothing gets through."}, {"id": "k3", "text": "Worst case, we play a fooled agent and use its key to send test money."}, {"id": "k4", "text": "The card says no."}, {"id": "k5", "text": "Even a fooled agent can't pay outside the card's rules."}]}, {"file": "07-why-it-held.m4a", "lines": [{"id": "y1", "text": "That's because every payment goes through eight layers. Six run on our server and make the agent behave."}, {"id": "y2", "text": "The last two are on-chain, and they keep every card inside its rules, even with our server taken over."}, {"id": "y3", "text": "A stolen agent key still only pays your listed sellers, up to the cap. The guardian key can only freeze. Your owner key stays on your phone."}, {"id": "w1", "text": "The second AI checks every seller and every payment."}, {"id": "w1b", "text": "It learns how you buy."}, {"id": "w2", "text": "After repeated attempts, it freezes the card, and only you can unfreeze it."}, {"id": "w3", "text": "It can only make your rules stricter, never looser."}]}, {"file": "08-hkma-proof.m4a", "lines": [{"id": "h1", "text": "The HKMA's Carmen Chu described AI agent governance in October, as anchored to intent, with kill switches, A.I. versus A.I., and secure boundaries."}, {"id": "h2", "text": "ChainBrain covers each of the four."}, {"id": "f1", "text": "On our hosted FISCO BCOS chain, all seven forbidden attempts were rejected."}, {"id": "f2", "text": "We attacked our own cards sixty-three times with test money, and lost nothing."}, {"id": "f3", "text": "And all four hundred and sixty-two tests passed."}]}, {"file": "09-team.m4a", "lines": [{"id": "t1", "text": "That's the three of us. Jun Quan and Hao Wen from Universiti Malaya, and Yong Xi from Universiti Putra Malaysia."}]}, {"file": "10-last-line.m4a", "lines": [{"id": "z1", "text": "Give your AI a card, not your wallet."}]}];let s=0,t0=null,raf=null;
const words=t=>t.split(/\s+/).length;
function plan(){const w=+document.getElementById('wpm').value;let t=3.0;/* 3 s of room tone first */
 return D[s].lines.map(l=>{const a=t,d=words(l.text)/w*60;t+=d+1.0;return{a,b:a+d}})}
function target(){const p=plan();return p[p.length-1].b}
function draw(){const m=document.getElementById('m');m.innerHTML='';D[s].lines.forEach(l=>{const p=document.createElement('p');p.className='line';
 p.innerHTML='<span class=id>'+l.id+'</span>'+l.text;m.appendChild(p)});document.getElementById('file').textContent=(s+1)+'/'+D.length+'  '+D[s].file;
 document.getElementById('target').textContent='target about '+target().toFixed(1)+' s incl. 3 s room tone; leave 1 s between lines';}
function tick(){const el=(performance.now()-t0)/1000,p=plan(),ps=[...document.querySelectorAll('.line')];
 ps.forEach((n,i)=>{n.className='line'+(el>=p[i].a&&el<p[i].b+0.6?' on':el>=p[i].b+0.6?' done':'')});
 const on=ps.find(n=>n.classList.contains('on'));if(on)on.scrollIntoView({block:'center',behavior:'smooth'});
 const c=document.getElementById('clock');c.textContent=el.toFixed(1)+' s'+(el<3?'  (room tone)':'');c.className=el>target()*1.1?'over':'';
 raf=requestAnimationFrame(tick)}
function go(){if(raf){cancelAnimationFrame(raf);raf=null;document.getElementById('go').textContent='Start (space)';return}
 t0=performance.now();document.getElementById('go').textContent='Stop (space)';tick()}
function move(d){if(raf)go();s=Math.max(0,Math.min(D.length-1,s+d));draw();window.scrollTo(0,0)}
document.getElementById('go').onclick=go;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('wpm').onchange=draw;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();go()}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
draw();
</script>
